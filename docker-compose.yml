services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - lokutara_mongo:/data/db
  redis:
    image: redis:7
    ports:
      - "6379:6379"

services:
  mongo:
    image: mongo:7
